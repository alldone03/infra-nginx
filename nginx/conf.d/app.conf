# HTTP → untuk challenge + redirect
server {
    listen 80;
    server_name app.insamo.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name app.insamo.id;

    ssl_certificate /etc/letsencrypt/live/app.insamo.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.insamo.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://frontend-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}