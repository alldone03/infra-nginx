events {}

http {
    # Default server (IP / unmatched host)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;

        ssl_certificate /etc/letsencrypt/live/dummy/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dummy/privkey.pem;

        location / {
            return 200 "NGINX GATEWAY OK\n";
        }
    }

    # HTTP challenge for certbot
    server {
        listen 80;
        server_name app.insamo.id apiapp.insamo.id cogniva.insamo.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Optional redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS domain blocks
    server {
        listen 443 ssl;
        server_name app.insamo.id;

        ssl_certificate /etc/letsencrypt/live/app.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.insamo.id/privkey.pem;

        location / {
            return 200 "Hello from app.insamo.id\n";
        }
    }

    server {
        listen 443 ssl;
        server_name apiapp.insamo.id;

        ssl_certificate /etc/letsencrypt/live/apiapp.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/apiapp.insamo.id/privkey.pem;

        location / {
            return 200 "Hello from apiapp.insamo.id\n";
        }
    }

    server {
        listen 443 ssl;
        server_name cogniva.insamo.id;

        ssl_certificate /etc/letsencrypt/live/cogniva.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cogniva.insamo.id/privkey.pem;

        location / {
            return 200 "Hello from cogniva.insamo.id\n";
        }
    }
}