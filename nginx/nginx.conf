events {}

http {
    # 1️⃣ Default server untuk IP / host yang tidak match domain
    server {
        listen 80 default_server;
        listen 443 ssl default_server;

        # Dummy self-signed SSL (untuk HTTPS IP)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            return 200 "NGINX GATEWAY OK\n";
        }
    }

    # 2️⃣ Domain app.insamo.id
    server {
        listen 443 ssl;
        server_name app.insamo.id;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            return 200 "Hello from app.insamo.id\n";
        }
    }

    # 3️⃣ Domain apiapp.insamo.id
    server {
        listen 443 ssl;
        server_name apiapp.insamo.id;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            return 200 "Hello from apiapp.insamo.id\n";
        }
    }

    # 4️⃣ Domain cogniva.insamo.id
    server {
        listen 443 ssl;
        server_name cogniva.insamo.id;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            return 200 "Hello from cogniva.insamo.id\n";
        }
    }
}
