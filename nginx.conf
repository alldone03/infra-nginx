events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # ===============================
    # RATE LIMIT ZONE (GLOBAL)
    # ===============================
    limit_req_zone $binary_remote_addr zone=frontend_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=backend_ip:10m rate=30r/s;
    limit_req_status 429;

    # ===============================
    # HTTP : ACME + REDIRECT
    # ===============================

    server {
        listen 80;
        server_name insamo.id;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name cogniva.insamo.id;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name project.insamo.id;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===============================
    # HTTPS : insamo.id
    # ===============================
    server {
        listen 443 ssl;
        server_name insamo.id;

        ssl_certificate /etc/letsencrypt/live/insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/insamo.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s;

        location /api/ {
            limit_req zone=backend_ip burst=60 nodelay;
            set $backend_url http://insamo-backend-prod:3000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;
            error_page 429 = @backend_rate_limited;
        }

        location / {
            limit_req zone=frontend_ip burst=60 nodelay;
            set $frontend_url http://insamo-frontend-prod:80;
            proxy_pass $frontend_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            error_page 429 = @frontend_rate_limited;
        }

        location @frontend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
        location @backend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
    }

    # ===============================
    # HTTPS : cogniva.insamo.id
    # ===============================
    server {
        listen 443 ssl;
        server_name cogniva.insamo.id;

        ssl_certificate /etc/letsencrypt/live/cogniva.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cogniva.insamo.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s;

        location /api/ {
            limit_req zone=backend_ip burst=60 nodelay;
            set $backend_url http://itsquizz-be:5000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;
            error_page 429 = @backend_rate_limited;
        }

        location /socket.io/ {
            set $backend_url http://itsquizz-be:5000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location / {
            limit_req zone=frontend_ip burst=60 nodelay;
            set $frontend_url http://itsquizz-fe:80;
            proxy_pass $frontend_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            error_page 429 = @frontend_rate_limited;
        }

        location @frontend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
        location @backend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
    }

    # ===============================
    # HTTPS : project.insamo.id
    # ===============================
    server {
        listen 443 ssl;
        server_name project.insamo.id;

        ssl_certificate     /etc/letsencrypt/live/project.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/project.insamo.id/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s;

        # ---------- PPE Dashboard ----------
        location /ppe/api/stream/ {
            set $ppe_url http://ppe-dashboard:5000;
            rewrite ^/ppe/(.*)$ /$1 break;
            proxy_pass $ppe_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location /ppe/ {
            limit_req zone=frontend_ip burst=60 nodelay;
            set $ppe_url http://ppe-dashboard:5000;
            rewrite ^/ppe/(.*)$ /$1 break;
            proxy_pass $ppe_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            error_page 429 = @project_rate_limited;
        }


        # ---------- Kopi Dashboard ----------
        location /kopi/api/ {
            set $kopi_url http://kopi-dashboard:3000;
            rewrite ^/kopi/(.*)$ /$1 break;
            proxy_pass $kopi_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15;
            client_max_body_size 1M;
        }

        location /kopi/ {
            limit_req zone=frontend_ip burst=60 nodelay;
            set $kopi_url http://kopi-dashboard:3000;
            rewrite ^/kopi/(.*)$ /$1 break;
            proxy_pass $kopi_url;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            error_page 429 = @project_rate_limited;
        }

        # ---------- Default: 404 ----------
        location / {
            return 404 "Not found. Available: /ppe/ dan /kopi/\n";
        }

        location @project_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
    }
}