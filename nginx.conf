events {}

http {
    # HTTP server: webroot for Certbot + redirect
    server {
        listen 80;
        server_name app.insamo.id apiapp.insamo.id cogniva.insamo.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server blocks
    server {
        listen 443 ssl;
        server_name app.insamo.id;

        ssl_certificate /etc/letsencrypt/live/app.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.insamo.id/privkey.pem;

        location / {
            return 200 "Hello from app.insamo.id\n";
        }
    }

    # server {
