events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ===============================
    # RATE LIMIT ZONE (GLOBAL)
    # ===============================
    limit_req_zone $binary_remote_addr zone=frontend_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=backend_ip:10m  rate=30r/s;
    limit_req_status 429;

    # ===============================
    # HTTP : ACME + REDIRECT
    # ===============================
    server {
        listen 80;
        server_name insamo.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name cogniva.insamo.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===============================
    # HTTPS : insamo.id
    # ===============================
    server {
        listen 443 ssl;
        server_name insamo.id;

        ssl_certificate     /etc/letsencrypt/live/insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/insamo.id/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Use Docker DNS to resolve internal service names even when VPN is active
        resolver 127.0.0.11 valid=30s;

        # ---------- BACKEND API ----------
        location /api/ {
            limit_req zone=backend_ip burst=60 nodelay;

            set $backend_url http://insamo-backend-prod:3000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;

            error_page 429 = @backend_rate_limited;
        }

        # ---------- SOCKET.IO ----------
        # location /socket.io/ {
        #     set $backend_url http://insamo-backend-prod:3000;
        #     proxy_pass $backend_url;
        #     proxy_http_version 1.1;

        #     # WebSocket
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     proxy_read_timeout 3600;
        #     proxy_send_timeout 3600;
        # }

        # ---------- FRONTEND ----------
        location / {
            limit_req zone=frontend_ip burst=60 nodelay;

            set $frontend_url http://insamo-frontend-prod:80;
            proxy_pass $frontend_url;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 429 = @frontend_rate_limited;
        }

        # ---------- RATE LIMIT PAGES ----------
        location @frontend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }

        location @backend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
    }
    server {
        listen 443 ssl;
        server_name cogniva.insamo.id;

        ssl_certificate     /etc/letsencrypt/live/cogniva.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cogniva.insamo.id/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Use Docker DNS to resolve internal service names even when VPN is active
        resolver 127.0.0.11 valid=30s;

        # ---------- BACKEND API ----------
        location /api/ {
            limit_req zone=backend_ip burst=60 nodelay;

            set $backend_url http://itsquizz-be:5000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;

            error_page 429 = @backend_rate_limited;
        }

        # ---------- SOCKET.IO ----------
        location /socket.io/ {
            set $backend_url http://itsquizz-be:5000;
            proxy_pass $backend_url;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # ---------- FRONTEND ----------
        location / {
            limit_req zone=frontend_ip burst=60 nodelay;

            set $frontend_url http://itsquizz-fe:80;
            proxy_pass $frontend_url;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 429 = @frontend_rate_limited;
        }

        # ---------- RATE LIMIT PAGES ----------
        location @frontend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }

        location @backend_rate_limited {
            default_type text/plain;
            return 429 "Too many requests. Please slow down.\n";
        }
    }
}