events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP server untuk challenge + redirect
    server {
        listen 80;
        server_name app.insamo.id apiapp.insamo.id cogniva.insamo.id;

        # Webroot ACME challenge untuk Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect traffic normal ke HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server untuk app.insamo.id
    server {
        listen 443 ssl;
        server_name app.insamo.id;

        ssl_certificate /etc/letsencrypt/live/app.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.insamo.id/privkey.pem;

        # location / {
        #     # root /var/www/html; # ganti sesuai folder aplikasi
        #     # index index.html index.php;
        #     return 200 "Hello from app.insamo.id!";
        # }
        location / {
            proxy_pass http://insamo-frontend-prod:80;  # port frontend container
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server untuk apiapp.insamo.id
    server {
        listen 443 ssl;
        server_name apiapp.insamo.id;

        ssl_certificate /etc/letsencrypt/live/apiapp.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/apiapp.insamo.id/privkey.pem;

        # location / {
        #     # root /var/www/html;
        #     # index index.html index.php;
        #     return 200 "Hello from apiapp.insamo.id!";
        # }
        location / {
            proxy_pass http://insamo-nginx-prod:80;  # port frontend container
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server untuk cogniva.insamo.id
    server {
        listen 443 ssl;
        server_name cogniva.insamo.id;

        ssl_certificate /etc/letsencrypt/live/cogniva.insamo.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cogniva.insamo.id/privkey.pem;

        location / {
            proxy_pass http://itsquizz-fe:80;  # port frontend container
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Python backend API
        location /api/ {
            proxy_pass http://itsquizz-be:5000;  # port backend container
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

    }
}